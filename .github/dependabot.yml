version: 2
updates:
  - package-ecosystem: nuget
    # The API graph switches to an unpublished ServiceDefaults PackageReference
    # inside Dependabot's GitHub Actions environment. Scan only project graphs
    # that restore independently until shared source dependencies are published.
    directories:
      - /Legacy.Maliev.AccountingService.Application
      - /Legacy.Maliev.AccountingService.Data
      - /Legacy.Maliev.AccountingService.Domain
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: Legacy.Maliev.ServiceDefaults
      - dependency-name: Legacy.Maliev.CompatibilityContracts
      # EF/Npgsql must move with the pinned shared ServiceDefaults runtime graph.
      # Tracking: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults#30.
      - dependency-name: Microsoft.EntityFrameworkCore
      - dependency-name: Microsoft.EntityFrameworkCore.Abstractions
      - dependency-name: Microsoft.EntityFrameworkCore.Design
      - dependency-name: Microsoft.EntityFrameworkCore.Relational
      - dependency-name: Npgsql.EntityFrameworkCore.PostgreSQL
    groups:
      nuget-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /Legacy.Maliev.AccountingService.Api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
