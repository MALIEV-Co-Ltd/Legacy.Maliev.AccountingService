name: Accounting custody source controls
on:
  pull_request:
    paths: ['eng/accounting-native-custody/**', '.github/workflows/accounting-custody-source-controls.yml']
  push:
    branches: [main]
    paths: ['eng/accounting-native-custody/**', '.github/workflows/accounting-custody-source-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: accounting-custody-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-controls:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCOUNTING_NATIVE_ENABLED: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Execute only synthetic source controls
        working-directory: eng/accounting-native-custody
        run: python -B accounting_source_controls_v3.py --receipt "$RUNNER_TEMP/accounting-custody-source-controls.json"
      - name: Retain source-only result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: accounting-custody-source-${{ github.sha }}
          path: ${{ runner.temp }}/accounting-custody-source-controls.json
          if-no-files-found: error
          retention-days: 7
