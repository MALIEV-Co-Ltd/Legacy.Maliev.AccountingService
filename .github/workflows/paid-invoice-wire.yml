name: PaidInvoice actual DTO wire acceptance

on:
  pull_request:
    branches: [main, develop, staging]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      VSTestCollect: XPlat Code Coverage
      VSTestLogger: trx
      VSTestResultsDirectory: ${{ github.workspace }}/paid-invoice-wire-results
      PAID_INVOICE_WIRE_OUTPUT_DIRECTORY: ${{ github.workspace }}/paid-invoice-wire-results/paid-invoice-wire
      VSTestTestCaseFilter: FullyQualifiedName~PaidInvoiceOutcomeWireTests
    steps:
      - name: Check out AccountingService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 7edcd961024868513fd5f373cab3dcb261197f77
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@e3a6093324a24968876782153286f52db8b29fd8
        with:
          solution: Legacy.Maliev.AccountingService.Tests/Legacy.Maliev.AccountingService.Tests.csproj
          use-local-maliev-dependencies: 'true'
      - name: Verify all 6 actual PaidInvoice wire cases, raw and source/export provenance
        run: python3 -B scripts/verify-paid-invoice-wire.py paid-invoice-wire-results --wire
      - name: Preserve actual DTO wire evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: paid-invoice-wire-${{ github.sha }}
          path: paid-invoice-wire-results
          if-no-files-found: warn
          retention-days: 7
